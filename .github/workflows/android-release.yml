
name: android-release

on:
  workflow_dispatch:
    inputs:
      signing_key:
        description: "play = the key Google Play already knows; upload = the CA upload key"
        type: choice
        default: play
        options: [play, upload]
      core_ref:
        description: "ZedSecure-Cores tag/ref to build (default: zedcore-r6)"
        type: string
        default: zedcore-r6
  workflow_call:
    inputs:
      signing_key:
        description: "play or upload"
        type: string
        required: false
        default: play
      core_ref:
        description: "ZedSecure-Cores tag/ref; use a tag or commit SHA"
        type: string
        required: false
        default: zedcore-r6
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
      PLAY_KEYSTORE_BASE64:
        required: false
      PLAY_KEYSTORE_PASSWORD:
        required: false
      PLAY_KEY_ALIAS:
        required: false
      PLAY_KEY_PASSWORD:
        required: false

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Use preinstalled Android SDK and NDK.
      # No sdkmanager and no repeated SDK/NDK downloads.
      - name: Use preinstalled Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK_VERSION="29.0.14206865"
          NDK_ROOT="$SDK_ROOT/ndk/$NDK_VERSION"

          [[ -d "$SDK_ROOT/platforms/android-37.0" ]] || {
            echo "::error::Android API 37 is not present on this runner image: $SDK_ROOT/platforms/android-37.0"
            exit 1
          }
          [[ -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]] || {
            echo "::error::Preinstalled NDK $NDK_VERSION is missing. No SDK/NDK download will be attempted."
            exit 1
          }
          [[ -x "$SDK_ROOT/platform-tools/adb" ]] || {
            echo "::error::Android platform-tools are missing from the runner image"
            exit 1
          }

          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          [[ -n "$BUILD_TOOLS" && -x "$BUILD_TOOLS/aapt2" && -x "$BUILD_TOOLS/apksigner" && -x "$BUILD_TOOLS/zipalign" ]] || {
            echo "::error::Preinstalled Android build-tools are incomplete"
            exit 1
          }

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$NDK_ROOT"
            echo "ANDROID_NDK_ROOT=$NDK_ROOT"
            echo "ZED_ANDROID_NDK_VERSION=$NDK_VERSION"
          } >> "$GITHUB_ENV"

          echo "Using preinstalled Android SDK: $SDK_ROOT"
          echo "Using Android API: 37.0"
          echo "Using preinstalled build-tools: $(basename "$BUILD_TOOLS")"
          echo "Using preinstalled NDK: $NDK_VERSION"

      - name: Set up Go for zedcore
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^zedsecure.versionName=//p' gradle.properties | head -n1)"
          VERSION_CODE="$(sed -n 's/^zedsecure.versionCode=//p' gradle.properties | head -n1)"
          [[ -n "$VERSION_NAME" ]] || { echo "::error::zedsecure.versionName is missing"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "::error::zedsecure.versionCode must be numeric"; exit 1; }
          {
            echo "name=$VERSION_NAME"
            echo "code=$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"
          echo "Building ZedSecure $VERSION_NAME (versionCode $VERSION_CODE)"

      # Fetch pinned engines but skip the prebuilt zedcore.aar.
      - name: Fetch pinned Android native engines (without prebuilt zedcore)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("tools/get-cores.sh").read_text(encoding="utf-8")
          needle = '    cp "$(fetch zedcore zedcore.aar)" "$ROOT/app/libs/zedcore.aar"\n'
          if source.count(needle) != 1:
              raise SystemExit("get-cores.sh changed; refusing to guess how to skip its prebuilt zedcore.aar download")

          target = Path("tools/.get-cores-native-only.sh")
          target.write_text(
              source.replace(
                  needle,
                  "    # zedcore.aar is built from source in the next workflow step.\n"
              ),
              encoding="utf-8",
          )
          target.chmod(0o755)
          PY
          trap 'rm -f tools/.get-cores-native-only.sh' EXIT
          ./tools/.get-cores-native-only.sh android

      # Compile zedcore.aar from source.
      # The official Core build script applies the Psiphon TLS patch.
      - name: Build zedcore.aar from source
        id: core
        shell: bash
        env:
          CORES_REF: ${{ inputs.core_ref }}
          GOTOOLCHAIN: go1.27.3
        run: |
          set -euo pipefail
          CORE_REF="${CORES_REF:-zedcore-r6}"
          CORE_DIR="$RUNNER_TEMP/ZedSecure-Cores"
          rm -rf "$CORE_DIR"

          git init "$CORE_DIR"
          git -C "$CORE_DIR" remote add origin https://github.com/CluvexStudio/ZedSecure-Cores.git
          git -C "$CORE_DIR" fetch --no-tags --depth=1 origin "$CORE_REF"
          git -C "$CORE_DIR" checkout --detach FETCH_HEAD
          CORE_COMMIT="$(git -C "$CORE_DIR" rev-parse HEAD)"

          echo "ZedSecure-Cores ref: $CORE_REF"
          echo "ZedSecure-Cores commit: $CORE_COMMIT"

          test -s "$CORE_DIR/scripts/fetch.sh"
          test -s "$CORE_DIR/scripts/build-zedcore.sh"
          test -s "$CORE_DIR/patches/psiphon-tls-go1.27.patch"

          echo ">>> Fetching exact dependency commits from pins.txt"
          (cd "$CORE_DIR" && ./scripts/fetch.sh)

          echo ">>> Installing gomobile with Go 1.27.3"
          export PATH="$HOME/go/bin:$PATH"
          go version
          go install golang.org/x/mobile/cmd/gomobile@latest
          command -v gomobile
          gomobile init

          # Remove any pre-existing AAR to ensure source compilation.
          rm -f app/libs/zedcore.aar

          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:?ANDROID_NDK_HOME was not set by the runner check}"
          export JAVA_HOME="$JAVA_HOME"
          export TARGETS="android/arm64,android/arm,android/amd64"
          export PATH="$HOME/go/bin:$JAVA_HOME/bin:$PATH"

          (cd "$CORE_DIR" && ./scripts/build-zedcore.sh)

          BUILT_AAR="$CORE_DIR/out/zedcore.aar"
          [[ -s "$BUILT_AAR" ]] || {
            echo "::error::Source build did not produce zedcore.aar"
            exit 1
          }

          mkdir -p app/libs
          install -m 0644 "$BUILT_AAR" app/libs/zedcore.aar
          unzip -tq app/libs/zedcore.aar

          AAR_ENTRIES="$(unzip -Z1 app/libs/zedcore.aar)"
          grep -Fxq 'classes.jar' <<< "$AAR_ENTRIES" || {
            echo "::error::Built AAR has no classes.jar"
            exit 1
          }

          for abi in arm64-v8a armeabi-v7a x86_64; do
            grep -Eq "^jni/$abi/[^/]+\.so$" <<< "$AAR_ENTRIES" || {
              echo "::error::Built zedcore.aar has no native library for $abi"
              exit 1
            }
          done

          AAR_SHA="$(sha256sum app/libs/zedcore.aar | awk '{print $1}')"

          {
            echo "commit=$CORE_COMMIT"
            echo "ref=$CORE_REF"
            echo "aar_sha256=$AAR_SHA"
            echo "go_version=$(go version)"
            echo "ndk_version=${ZED_ANDROID_NDK_VERSION}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "ZedSecure-Cores ref: $CORE_REF"
            echo "ZedSecure-Cores commit: $CORE_COMMIT"
            echo "Go: $(go version)"
            echo "Android NDK: ${ZED_ANDROID_NDK_VERSION}"
            echo "Source-built zedcore.aar SHA-256: $AAR_SHA"
            echo
            echo "Pinned source dependencies (pins.txt):"
            cat "$CORE_DIR/pins.txt"
          } > zedcore-build-provenance.txt

          echo ">>> Source-built zedcore.aar installed: $AAR_SHA"

          {
            echo "## zedcore source build"
            echo "- Ref: \`$CORE_REF\`"
            echo "- Commit: \`$CORE_COMMIT\`"
            echo "- Go: \`$(go version)\`"
            echo "- NDK: \`${ZED_ANDROID_NDK_VERSION}\`"
            echo "- AAR SHA-256: \`$AAR_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate native engine inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s app/libs/zedcore.aar || {
            echo "::error::app/libs/zedcore.aar is missing"
            exit 1
          }

          for abi in arm64-v8a armeabi-v7a x86_64; do
            abi_dir="app/src/main/jniLibs/$abi"
            mkdir -p "$abi_dir"

            for lib in libtor libobfs4proxy libsnowflake libconjure libsnispoof libhev-socks5-tunnel libopenconnect libzeptun-jni; do
              if [[ ! -f "$abi_dir/$lib.so" ]]; then
                echo "::warning::$abi/$lib.so is missing; that optional engine may not be available for this ABI"
              fi
            done

            for lib in libhev-socks5-tunnel libopenconnect libzeptun-jni; do
              so="$abi_dir/$lib.so"
              [[ -f "$so" ]] || continue

              if ! readelf --dyn-syms -W "$so" | grep -qE ' (JNI_OnLoad|Java_)'; then
                echo "::error::$so has no JNI entry points"
                exit 1
              fi
            done

            for so in "$abi_dir"/*.so; do
              [[ -f "$so" ]] || continue
              case "$so" in
                */libzeptun*) continue ;;
              esac

              if readelf -d "$so" | grep -qE '\(RELR\)|0x0*6fffe000 '; then
                echo "::error::$so uses RELR relocations, which are incompatible with Android 7/8"
                exit 1
              fi
            done
          done

          echo "Native libraries found:"
          find app/src/main/jniLibs -type f -name '*.so' -print | sort

      - name: Configure release signing
        shell: bash
        env:
          SIGNING_KEY: ${{ inputs.signing_key }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          case "$SIGNING_KEY" in
            play)
              ENCODED_KEYSTORE="${PLAY_KEYSTORE_BASE64:?Missing PLAY_KEYSTORE_BASE64}"
              STORE_PASSWORD="${PLAY_KEYSTORE_PASSWORD:?Missing PLAY_KEYSTORE_PASSWORD}"
              ALIAS="${PLAY_KEY_ALIAS:?Missing PLAY_KEY_ALIAS}"
              KEY_PASSWORD_VALUE="${PLAY_KEY_PASSWORD:?Missing PLAY_KEY_PASSWORD}"
              ;;
            upload)
              ENCODED_KEYSTORE="${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64}"
              STORE_PASSWORD="${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
              ALIAS="${KEY_ALIAS:?Missing KEY_ALIAS}"
              KEY_PASSWORD_VALUE="${KEY_PASSWORD:?Missing KEY_PASSWORD}"
              ;;
            *)
              echo "::error::signing_key must be 'play' or 'upload'"
              exit 1
              ;;
          esac

          printf '%s' "$ENCODED_KEYSTORE" | tr -d '[:space:]' | base64 --decode > release.keystore
          test -s release.keystore || {
            echo "::error::Decoded keystore is empty"
            exit 1
          }

          export ZED_STORE_PASSWORD="$STORE_PASSWORD"
          export ZED_KEY_PASSWORD="$KEY_PASSWORD_VALUE"
          export ZED_KEY_ALIAS="$ALIAS"

          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape_property(value: str) -> str:
              replacements = {
                  "\\": "\\\\",
                  "\t": "\\t",
                  "\n": "\\n",
                  "\r": "\\r",
                  "\f": "\\f",
              }
              result = []
              for index, char in enumerate(value):
                  if char in replacements:
                      result.append(replacements[char])
                  elif char in " =:#!" and (index == 0 or char != " "):
                      result.append("\\" + char)
                  elif char == " " and index == 0:
                      result.append("\\ ")
                  else:
                      result.append(char)
              return "".join(result)

          properties = {
              "storeFile": "release.keystore",
              "storePassword": os.environ["ZED_STORE_PASSWORD"],
              "keyPassword": os.environ["ZED_KEY_PASSWORD"],
              "keyAlias": os.environ["ZED_KEY_ALIAS"],
          }

          Path("keystore.properties").write_text(
              "".join(
                  f"{key}={escape_property(value)}\n"
                  for key, value in properties.items()
              ),
              encoding="utf-8",
          )
          Path("keystore.properties").chmod(0o600)
          PY

      # Build APK splits in a separate Gradle invocation.
      - name: Build split APKs
        run: ./gradlew --no-daemon --warning-mode all :app:assembleRelease

      - name: Package and verify APKs
        id: apk
        shell: bash
        env:
          SIGNING_KEY: ${{ inputs.signing_key }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.name }}'
          mkdir -p dist

          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app/build/outputs/apk/release/app-$abi-release.apk"
            [[ -s "$src" ]] || {
              echo "::error::Missing split APK: $src"
              exit 1
            }
            cp "$src" "dist/ZedSecure-$VERSION-$abi.apk"
          done

          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"

          [[ -x "$BT/apksigner" && -x "$BT/zipalign" && -x "$BT/aapt2" ]] || {
            echo "::error::Android build-tools are incomplete: $BT"
            exit 1
          }

          # Merge ARM APKs using the project's official helper.
          python3 tools/universal-apk.py \
            "dist/ZedSecure-$VERSION-arm64-v8a.apk" \
            /tmp/zedsecure-universal.apk \
            "dist/ZedSecure-$VERSION-armeabi-v7a.apk"

          "$BT/zipalign" -f -P 16 4 \
            /tmp/zedsecure-universal.apk \
            /tmp/zedsecure-universal-aligned.apk

          case "$SIGNING_KEY" in
            play)
              STORE_PW="${PLAY_KEYSTORE_PASSWORD:?Missing PLAY_KEYSTORE_PASSWORD}"
              KEY_PW="${PLAY_KEY_PASSWORD:?Missing PLAY_KEY_PASSWORD}"
              KEY_ALIAS_VALUE="${PLAY_KEY_ALIAS:?Missing PLAY_KEY_ALIAS}"
              ;;
            upload)
              STORE_PW="${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
              KEY_PW="${KEY_PASSWORD:?Missing KEY_PASSWORD}"
              KEY_ALIAS_VALUE="${KEY_ALIAS:?Missing KEY_ALIAS}"
              ;;
            *)
              echo "::error::signing_key must be 'play' or 'upload'"
              exit 1
              ;;
          esac

          export STORE_PW KEY_PW

          "$BT/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS_VALUE" \
            --ks-pass env:STORE_PW \
            --key-pass env:KEY_PW \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --out "dist/ZedSecure-$VERSION-universal.apk" \
            /tmp/zedsecure-universal-aligned.apk

          rm -f /tmp/zedsecure-universal.apk /tmp/zedsecure-universal-aligned.apk

          REFERENCE_CERT=""

          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="dist/ZedSecure-$VERSION-$abi.apk"

            "$BT/apksigner" verify "$apk"
            "$BT/zipalign" -c -P 16 4 "$apk"

            BADGING="$("$BT/aapt2" dump badging "$apk")"

            grep -Fq "versionName='$VERSION'" <<< "$BADGING" || {
              echo "::error::$apk has an unexpected versionName"
              exit 1
            }

            grep -Fq "native-code: '$abi'" <<< "$BADGING" || {
              echo "::error::$apk does not contain the expected ABI ($abi)"
              exit 1
            }

            CERT="$("$BT/apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256' | awk '{print $NF}')"

            [[ -n "$CERT" ]] || {
              echo "::error::Could not read signer certificate for $apk"
              exit 1
            }

            if [[ -z "$REFERENCE_CERT" ]]; then
              REFERENCE_CERT="$CERT"
            elif [[ "$CERT" != "$REFERENCE_CERT" ]]; then
              echo "::error::$apk is signed with a different certificate"
              exit 1
            fi
          done

          UNIVERSAL="dist/ZedSecure-$VERSION-universal.apk"

          "$BT/apksigner" verify "$UNIVERSAL"
          "$BT/zipalign" -c -P 16 4 "$UNIVERSAL"

          UNIVERSAL_BADGING="$("$BT/aapt2" dump badging "$UNIVERSAL")"

          grep -Fq "native-code: 'arm64-v8a' 'armeabi-v7a'" <<< "$UNIVERSAL_BADGING" || {
            echo "::error::Universal APK does not contain both ARM ABIs"
            exit 1
          }

          UNIVERSAL_CERT="$("$BT/apksigner" verify --print-certs "$UNIVERSAL" | grep -m1 'SHA-256' | awk '{print $NF}')"

          [[ "$UNIVERSAL_CERT" == "$REFERENCE_CERT" ]] || {
            echo "::error::Universal APK signer does not match the split APKs"
            exit 1
          }

          echo "Verified APKs:"
          ls -lh dist/*.apk

      # Build AAB separately so Gradle can apply the project's bundle configuration.
      - name: Build Google Play App Bundle
        run: ./gradlew --no-daemon --warning-mode all :app:bundleRelease

      - name: Package and verify AAB and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.name }}'
          VERSION_CODE='${{ steps.version.outputs.code }}'

          AAB_SOURCE="app/build/outputs/bundle/release/app-release.aab"

          [[ -s "$AAB_SOURCE" ]] || {
            echo "::error::Missing AAB: $AAB_SOURCE"
            exit 1
          }

          AAB="dist/ZedSecure-$VERSION.aab"
          cp "$AAB_SOURCE" "$AAB"

          unzip -t "$AAB" >/dev/null
          AAB_ENTRIES="$(unzip -Z1 "$AAB")"

          grep -Fxq 'base/manifest/AndroidManifest.xml' <<< "$AAB_ENTRIES" || {
            echo "::error::AAB is missing the base manifest"
            exit 1
          }

          for abi in arm64-v8a armeabi-v7a x86_64; do
            if ! grep -Eq "^base/lib/$abi/[^/]+\.so$" <<< "$AAB_ENTRIES"; then
              echo "::error::AAB has no native libraries for $abi"
              exit 1
            fi
          done

          cp zedcore-build-provenance.txt dist/BUILD-INFO-zedcore.txt

          ( cd dist && sha256sum ZedSecure-* > SHA256SUMS-android.txt )

          echo "AAB native libraries:"
          grep -E '^base/lib/(arm64-v8a|armeabi-v7a|x86_64)/.*\.so$' <<< "$AAB_ENTRIES" | sort

          echo "Release files:"
          ls -lh dist

          echo "SHA-256 checksums:"
          cat dist/SHA256SUMS-android.txt

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          shred -u release.keystore keystore.properties 2>/dev/null || \
            rm -f release.keystore keystore.properties

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: ZedSecure-${{ steps.version.outputs.name }}-arm64-v8a
          path: dist/ZedSecure-${{ steps.version.outputs.name }}-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Universal APK
        uses: actions/upload-artifact@v7
        with:
          name: ZedSecure-${{ steps.version.outputs.name }}-universal
          path: dist/ZedSecure-${{ steps.version.outputs.name }}-universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v7
        with:
          name: ZedSecure-${{ steps.version.outputs.name }}-GooglePlay-bundle
          path: dist/ZedSecure-${{ steps.version.outputs.name }}.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload other ABIs and checksums
        uses: actions/upload-artifact@v7
        with:
          name: ZedSecure-${{ steps.version.outputs.name }}-other-abis
          path: |
            dist/ZedSecure-${{ steps.version.outputs.name }}-armeabi-v7a.apk
            dist/ZedSecure-${{ steps.version.outputs.name }}-x86_64.apk
            dist/SHA256SUMS-android.txt
            dist/BUILD-INFO-zedcore.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish APKs, AAB and checksums to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.name }}-b${{ steps.version.outputs.code }}"

          echo "Publishing ZedSecure ${{ steps.version.outputs.name }} as $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "ZedSecure v${{ steps.version.outputs.name }}" \
              --notes "Android release: split APKs, ARM universal APK, Google Play AAB and SHA-256 checksums."
          fi
