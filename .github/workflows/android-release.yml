name: android-release

on:
  workflow_dispatch:
    inputs:
      signing_key:
        description: "play = the key Google Play already knows; upload = the CA key"
        type: choice
        default: play
        options: [play, upload]
  workflow_call:
    inputs:
      signing_key:
        type: string
        default: play

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v3

      - name: Read the version
        id: v
        run: |
          echo "name=$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep '^zedsecure.versionCode=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Take every engine from its own build
        run: ./tools/get-cores.sh android

      - name: Build OpenConnect natively
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config gettext libssl-dev
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
          newest=$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -1)
          NDK="$ANDROID_HOME/ndk/$newest"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export ANDROID_NDK_ROOT="$NDK"
          
          WORK="/tmp/openconnect-build"
          mkdir -p "$WORK"
          git clone --depth 1 --branch "v9.12" https://gitlab.com/openconnect/openconnect.git "$WORK/openconnect"
          
          API=24
          for abi in arm64-v8a armeabi-v7a x86_64; do
            case "$abi" in
              arm64-v8a)   host=aarch64-linux-android; cc=aarch64-linux-android$API-clang ;;
              armeabi-v7a) host=arm-linux-androideabi; cc=armv7a-linux-androideabi$API-clang ;;
              x86_64)      host=x86_64-linux-android;  cc=x86_64-linux-android$API-clang ;;
            esac
            build="$WORK/$abi"
            rm -rf "$build" && mkdir -p "$build"
            cp -r "$WORK/openconnect" "$build/src"
            export CC="$cc" AR=llvm-ar RANLIB=llvm-ranlib STRIP=llvm-strip
            
            (cd "$build/src" &&
              ./autogen.sh >/dev/null 2>&1 &&
              LDFLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384" \
              ./configure --host="$host" \
                --disable-nls --without-libpcsclite --without-stoken --without-libpskc \
                --without-gssapi --with-openssl --enable-shared --disable-static >/dev/null 2>&1 &&
              make -j"$(nproc)" libopenconnect.la >/dev/null 2>&1)
            
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$build/src/.libs/libopenconnect.so" "app/src/main/jniLibs/$abi/libopenconnect.so"
            llvm-strip "app/src/main/jniLibs/$abi/libopenconnect.so"
          done

      - name: Check the engines
        run: |
          set -e
          ls -l app/libs/zedcore.aar
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libtor libobfs4proxy libsnowflake libconjure libsnispoof libhev-socks5-tunnel libopenconnect libzeptun-jni; do
              [ -f "app/src/main/jniLibs/$abi/$lib.so" ] || echo "::warning::$abi/$lib.so is missing; that protocol will not work"
            done
            for lib in libhev-socks5-tunnel libopenconnect libzeptun-jni; do
              so="app/src/main/jniLibs/$abi/$lib.so"
              [ -f "$so" ] || continue
              readelf --dyn-syms -W "$so" | grep -qE ' (JNI_OnLoad|Java_)' || { echo "::error::$abi/$lib.so has no JNI entry points; the app would crash loading it"; exit 1; }
            done
            for so in app/src/main/jniLibs/$abi/*.so; do
              case "$so" in */libzeptun*) continue ;; esac
              if readelf -d "$so" | grep -qE '\(RELR\)|0x0*6fffe000 '; then echo "::error::$so uses RELR relocations, which Android 7 and 8 cannot load"; exit 1; fi
            done
          done
          find app/src/main/jniLibs -name '*.so' | sort

      - name: Unlock signing
        env:
          USE_PLAY: ${{ inputs.signing_key != 'upload' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          umask 077
          if [ "$USE_PLAY" = "true" ]; then
            echo "$PLAY_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release.keystore
            STORE_PW="$PLAY_KEYSTORE_PASSWORD"; KEY_PW="$PLAY_KEY_PASSWORD"; ALIAS="$PLAY_KEY_ALIAS"
          else
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release.keystore
            STORE_PW="$KEYSTORE_PASSWORD"; KEY_PW="$KEY_PASSWORD"; ALIAS="$KEY_ALIAS"
          fi
          { echo "storeFile=release.keystore"; echo "storePassword=$STORE_PW"
            echo "keyPassword=$KEY_PW"; echo "keyAlias=$ALIAS"; } > keystore.properties

      - name: Build APKs and Bundle (AAB)
        run: ./gradlew --warning-mode all :app:assembleRelease :app:bundleRelease

      - name: Package and Verify Everything
        run: |
          set -e
          mkdir -p dist
          V='${{ steps.v.outputs.name }}'
          
          # --- پردازش و آماده‌سازی APKها ---
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app/build/outputs/apk/release/app-$abi-release.apk"
            [ -f "$src" ] || { echo "::error::$src was not built"; exit 1; }
            cp "$src" "dist/ZedSecure-$V-$abi.apk"
          done
          
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python3 tools/universal-apk.py "dist/ZedSecure-$V-arm64-v8a.apk" /tmp/universal.apk "dist/ZedSecure-$V-armeabi-v7a.apk"
          "$BT/zipalign" -f -P 16 4 /tmp/universal.apk /tmp/universal-aligned.apk
          STORE_PW=$(grep '^storePassword=' keystore.properties | cut -d= -f2-) \
          KEY_PW=$(grep '^keyPassword=' keystore.properties | cut -d= -f2-) \
          "$BT/apksigner" sign --ks release.keystore \
            --ks-key-alias "$(grep '^keyAlias=' keystore.properties | cut -d= -f2-)" \
            --ks-pass env:STORE_PW --key-pass env:KEY_PW \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false \
            --out "dist/ZedSecure-$V-universal.apk" /tmp/universal-aligned.apk
          rm -f /tmp/universal.apk /tmp/universal-aligned.apk

          for apk in dist/ZedSecure-*.apk; do
            "$BT/apksigner" verify "$apk"
          done
          
          # --- پردازش و آماده‌سازی AAB (باندل گوگل‌پلی) ---
          aab_src="app/build/outputs/bundle/release/app-release.aab"
          [ -f "$aab_src" ] || { echo "::error::$aab_src was not built"; exit 1; }
          cp "$aab_src" "dist/ZedSecure-$V.aab"
          
          unzip -l "dist/ZedSecure-$V.aab" | awk '/base\/lib\//{print $4}' | sort > libs.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libgojni libtor libobfs4proxy libconjure libsnowflake libsnispoof libhev-socks5-tunnel libopenconnect libzeptun libzeptun-jni; do
              grep -qx "base/lib/$abi/$lib.so" libs.txt || { echo "::error::$abi/$lib.so is not in the bundle"; exit 1; }
            done
          done
          
          # تولید مجموع هش‌ها (Checksums)
          ( cd dist && sha256sum ZedSecure-* > SHA256SUMS-android.txt )
          ls -lh dist

      - name: Forget the key
        if: always()
        run: shred -u release.keystore keystore.properties 2>/dev/null || rm -f release.keystore keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: "zedsecure-android-${{ steps.v.outputs.name }}-${{ steps.v.outputs.code }}"
          path: dist/*
          retention-days: 30
