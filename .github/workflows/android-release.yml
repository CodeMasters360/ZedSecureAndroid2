name: android-release

on:
  workflow_dispatch:
    inputs:
      signing_key:
        description: "play = the key Google Play already knows; upload = the CA key"
        type: choice
        default: play
        options: [play, upload]
  workflow_call:
    inputs:
      signing_key:
        type: string
        default: play

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v3
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Read the version
        id: v
        run: |
          echo "name=$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep '^zedsecure.versionCode=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Take base engines
        run: ./tools/get-cores.sh android

      # کامپایل هسته zedcore با پچ بدون کرش Psiphon-TLS
      - name: Build fresh and patched zedcore.aar
        run: |
          set -e
          echo ">>> Setting up Go tools for zedcore compilation..."
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$HOME/go/bin:$PATH"
          gomobile init
          
          WORK_DIR="/tmp/cores-build"
          mkdir -p "$WORK_DIR"
          git clone --depth 1 https://github.com/CluvexStudio/ZedSecure-Cores.git "$WORK_DIR"
          
          (cd "$WORK_DIR" && ./scripts/fetch.sh)
          
          # خنثی‌سازی ارور panic در unsafe.go
          sed -i 's/patch -d "$PTLS_DIR".*/chmod -R u+w "$PTLS_DIR" \&\& sed -i "s\/panic(fmt.Sprintf(\\"tls: ConnectionState\/\\\/\\\/ panic(\/g" "$PTLS_DIR\/unsafe.go" || true/' "$WORK_DIR/scripts/build-zedcore.sh"
          
          (cd "$WORK_DIR" && \
            export ANDROID_HOME="$ANDROID_HOME" && \
            export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)" && \
            ./scripts/build-zedcore.sh)
          
          mkdir -p app/libs
          cp -f "$WORK_DIR/out/zedcore.aar" app/libs/zedcore.aar
          echo ">>> Successfully placed patched zedcore.aar"

      # اضافه کردن پیش‌نیازهای OpenConnect با پشتیبانی JNI
      - name: Fetch prebuilt OpenConnect with JNI
        run: |
          set -e
          TMP_DIR="/tmp/oc-download"
          mkdir -p "$TMP_DIR"
          
          curl -fsSL --retry 3 -o "$TMP_DIR/openconnect.apk" "https://f-droid.org/repo/net.openconnect_vpn.android_1120.apk"
          unzip -q -o "$TMP_DIR/openconnect.apk" "lib/*" -d "$TMP_DIR/extracted"
          
          mkdir -p "app/src/main/jniLibs/arm64-v8a" "app/src/main/jniLibs/x86_64" "app/src/main/jniLibs/armeabi-v7a"
          
          cp "$TMP_DIR/extracted/lib/arm64-v8a/"*.so "app/src/main/jniLibs/arm64-v8a/"
          cp "$TMP_DIR/extracted/lib/x86_64/"*.so "app/src/main/jniLibs/x86_64/"
          cp "$TMP_DIR/extracted/lib/armeabi/"*.so "app/src/main/jniLibs/armeabi-v7a/"
          rm -rf "$TMP_DIR"

      # فعال‌سازی ساخت فابریک فایل‌های تفکیک‌شده در گریدل (طبق معماری بیلدر اصلی)
      - name: Configure Gradle for native splits
        run: |
          cat >> app/build.gradle.kts <<'EOF'
          android {
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a", "armeabi-v7a", "x86_64")
                      isUniversalApk = false
                  }
              }
          }
          EOF

      - name: Check the engines
        run: |
          set -e
          ls -l app/libs/zedcore.aar
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libtor libobfs4proxy libsnowflake libconjure libsnispoof libhev-socks5-tunnel libopenconnect libzeptun-jni; do
              [ -f "app/src/main/jniLibs/$abi/$lib.so" ] || echo "::warning::$abi/$lib.so is missing; that protocol will not work"
            done
            for lib in libhev-socks5-tunnel libopenconnect libzeptun-jni; do
              so="app/src/main/jniLibs/$abi/$lib.so"
              [ -f "$so" ] || continue
              readelf --dyn-syms -W "$so" | grep -qE ' (JNI_OnLoad|Java_)' || { echo "::error::$abi/$lib.so has no JNI entry points; the app would crash loading it"; exit 1; }
            done
            for so in app/src/main/jniLibs/$abi/*.so; do
              case "$so" in */libzeptun*) continue ;; esac
              if readelf -d "$so" | grep -qE '\(RELR\)|0x0*6fffe000 '; then echo "::error::$so uses RELR relocations, which Android 7 and 8 cannot load"; exit 1; fi
            done
          done
          find app/src/main/jniLibs -name '*.so' | sort

      - name: Unlock signing
        env:
          USE_PLAY: ${{ inputs.signing_key != 'upload' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          umask 077
          if [ "$USE_PLAY" = "true" ]; then
            echo "$PLAY_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release.keystore
            STORE_PW="$PLAY_KEYSTORE_PASSWORD"; KEY_PW="$PLAY_KEY_PASSWORD"; ALIAS="$PLAY_KEY_ALIAS"
          else
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release.keystore
            STORE_PW="$KEYSTORE_PASSWORD"; KEY_PW="$KEY_PASSWORD"; ALIAS="$KEY_ALIAS"
          fi
          { echo "storeFile=release.keystore"; echo "storePassword=$STORE_PW"
            echo "keyPassword=$KEY_PW"; echo "keyAlias=$ALIAS"; } > keystore.properties

      # ساخت بیلد فابریک گریدل دقیقاً مانند بیلدر اصلی
      - name: Build
        run: ./gradlew --warning-mode all :app:assembleRelease

      # پکیجینگ و ادغام با اسکریپت فابریک universal-apk.py دقیقاً طبق منطق سازنده اصلی
      - name: Name them for people (Original Logic)
        run: |
          set -e
          mkdir -p dist
          V='${{ steps.v.outputs.name }}'
          
          # کپی فایل‌های اصلی تفکیک‌شده که مستقیماً توسط گریدل بیلد شده‌اند
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app/build/outputs/apk/release/app-$abi-release.apk"
            [ -f "$src" ] || { echo "::error::$src was not built"; exit 1; }
            cp "$src" "dist/ZedSecure-$V-$abi.apk"
          done
          
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          
          # اجرای اسکریپت اصلی سازنده برای ساخت بدون نقصِ universal.apk
          python3 tools/universal-apk.py "dist/ZedSecure-$V-arm64-v8a.apk" /tmp/universal.apk "dist/ZedSecure-$V-armeabi-v7a.apk"
          "$BT/zipalign" -f -P 16 4 /tmp/universal.apk /tmp/universal-aligned.apk
          
          STORE_PW=$(grep '^storePassword=' keystore.properties | cut -d= -f2-)
          KEY_PW=$(grep '^keyPassword=' keystore.properties | cut -d= -f2-)
          KEY_ALIAS=$(grep '^keyAlias=' keystore.properties | cut -d= -f2-)
          
          "$BT/apksigner" sign --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PW" --key-pass "pass:$KEY_PW" \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false \
            --out "dist/ZedSecure-$V-universal.apk" /tmp/universal-aligned.apk
          rm -f /tmp/universal.apk /tmp/universal-aligned.apk
          
          for apk in dist/ZedSecure-*.apk; do
            "$BT/apksigner" verify "$apk"
          done
          
          ( cd dist && sha256sum ZedSecure-*.apk > SHA256SUMS-android.txt )
          ls -lh dist

      - name: Forget the key
        if: always()
        run: shred -u release.keystore keystore.properties 2>/dev/null || rm -f release.keystore keystore.properties

      # آپلود جداگانه هر پکیج به صورت سبک
      - name: Upload arm64-v8a APK (سبک و فابریک برای گوشی‌های جدید)
        uses: actions/upload-artifact@v4
        with:
          name: "ZedSecure-${{ steps.v.outputs.name }}-arm64-v8a"
          path: dist/*-arm64-v8a.apk
          retention-days: 30

      - name: Upload Universal APK (نسخه کامل ساخته شده با universal-apk.py)
        uses: actions/upload-artifact@v4
        with:
          name: "ZedSecure-${{ steps.v.outputs.name }}-universal"
          path: dist/*-universal.apk
          retention-days: 30

      - name: Upload other ABIs
        uses: actions/upload-artifact@v4
        with:
          name: "ZedSecure-${{ steps.v.outputs.name }}-other-abis"
          path: |
            dist/*-armeabi-v7a.apk
            dist/*-x86_64.apk
            dist/SHA256SUMS-android.txt
          retention-days: 30

      - name: Publish Direct APKs to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v${{ steps.v.outputs.name }}-b${{ steps.v.outputs.code }}"
          echo ">>> Publishing direct APK downloads to Release: $TAG"
          gh release create "$TAG" dist/* --title "ZedSecure v${{ steps.v.outputs.name }}" --notes "Official direct APK release" || gh release upload "$TAG" dist/* --clobber
