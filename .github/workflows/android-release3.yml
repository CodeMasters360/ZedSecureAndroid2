name: android-release3

on:
  workflow_dispatch:
    inputs:
      signing_key:
        description: "main = the original ZedSecure key; upload = the second key"
        type: choice
        default: main
        options: [main, upload]
  workflow_call:
    inputs:
      signing_key:
        type: string
        default: main

permissions:
  contents: write

env:
  UPSTREAM_REPO: CluvexStudio/ZedSecure
  CORES_REPO: CluvexStudio/ZedSecure-Cores
  # Read by zeptun's build_android.sh and ZedSecure-Cores' build-tor-android.sh
  ABIS: "arm64-v8a armeabi-v7a x86_64"

# ---------------------------------------------------------------------------
# Engines build & extraction
# ---------------------------------------------------------------------------

jobs:
  # -------------------------------------------------------------------------
  # 0. Pin one upstream revision and read which engine versions it expects
  # -------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.src.outputs.sha }}
      version: ${{ steps.src.outputs.version }}
      zedcore: ${{ steps.cores.outputs.zedcore }}
      tor: ${{ steps.cores.outputs.tor }}
      snispoof: ${{ steps.cores.outputs.snispoof }}
      hev: ${{ steps.cores.outputs.hev }}
      openconnect: ${{ steps.cores.outputs.openconnect }}
      zeptun_repo: ${{ steps.cores.outputs.zeptun_repo }}
      zeptun_tag: ${{ steps.cores.outputs.zeptun_tag }}
    steps:
      - name: Checkout upstream (only to read it)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}

      - name: Pin the revision and read the version
        id: src
        run: |
          VERSION=$(grep '^zedsecure.versionName=' gradle.properties 2>/dev/null | cut -d= -f2 | tr -d '\r\n')
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.run_number }}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read tools/cores.txt
        id: cores
        run: |
          set -e
          get() { awk -v n="$1" -v c="$2" '$1 == n { print $c }' tools/cores.txt; }
          for n in zedcore tor snispoof hev openconnect; do
            tag=$(get "$n" 3)
            [ -n "$tag" ] || { echo "::error::$n is not in tools/cores.txt"; exit 1; }
            echo "$n=$tag" >> "$GITHUB_OUTPUT"
          done
          repo=$(get zeptun 2); tag=$(get zeptun 3)
          [ -n "$repo" ] && [ -n "$tag" ] || { echo "::error::zeptun is not in tools/cores.txt"; exit 1; }
          echo "zeptun_repo=$repo" >> "$GITHUB_OUTPUT"
          echo "zeptun_tag=$tag" >> "$GITHUB_OUTPUT"
          cat tools/cores.txt

  # -------------------------------------------------------------------------
  # 1. zedcore.aar  (Xray, sing-box, Psiphon, zeddns, MasterDNS ... via gomobile)
  # -------------------------------------------------------------------------
  zedcore:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Make room
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc \
                      /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
                      "$AGENT_TOOLSDIRECTORY/CodeQL" "$AGENT_TOOLSDIRECTORY/PyPy" \
                      "$AGENT_TOOLSDIRECTORY/Ruby" /usr/local/.ghcup || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Get the ZedSecure-Cores build scripts at the expected version
        env:
          TAG: ${{ needs.plan.outputs.zedcore }}
        run: |
          git clone -q --filter=blob:none "https://github.com/${CORES_REPO}.git" _cores
          git -C _cores checkout -q "$TAG" || echo "::warning::tag $TAG not found in $CORES_REPO, using its default branch"
          git -C _cores log -1 --format='ZedSecure-Cores at %h: %s'

      - name: Every engine source at its pinned commit
        working-directory: _cores
        run: ./scripts/fetch.sh

      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: _cores/vendor/AndroidLibXrayLite/go.sum

      - name: Install an NDK that can link cronet
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
          newest=$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -1)
          case "$newest" in
            2[0-7].*) echo "::error::still on NDK $newest; its linker cannot read the cronet archive"; exit 1 ;;
          esac
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$newest" >> "$GITHUB_ENV"
          for old in $(ls -1 "$ANDROID_HOME/ndk" | grep -v "^$newest$"); do
            sudo rm -rf "$ANDROID_HOME/ndk/$old"
          done
          echo "building with NDK $newest"
          df -h / | tail -1

      - name: gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build zedcore.aar
        working-directory: _cores
        env:
          ZEDCORE_TMPDIR: ${{ runner.temp }}/zedcore
        run: |
          mkdir -p "$ZEDCORE_TMPDIR"
          ./scripts/build-zedcore.sh
          for abi in $ABIS; do
            unzip -l out/zedcore.aar | grep -q "jni/$abi/libgojni.so" || { echo "::error::zedcore.aar has no $abi"; exit 1; }
          done
          ls -l out/zedcore.aar

      - uses: actions/upload-artifact@v7
        with:
          name: core-zedcore
          path: _cores/out/zedcore.aar
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------
  # 2. libtor, libobfs4proxy (lyrebird), libconjure, libsnowflake
  # -------------------------------------------------------------------------
  tor:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Get the ZedSecure-Cores build scripts at the expected version
        env:
          TAG: ${{ needs.plan.outputs.tor }}
        run: |
          git clone -q --filter=blob:none "https://github.com/${CORES_REPO}.git" _cores
          git -C _cores checkout -q "$TAG" || echo "::warning::tag $TAG not found in $CORES_REPO, using its default branch"
          git -C _cores log -1 --format='ZedSecure-Cores at %h: %s'

      - uses: actions/setup-go@v7
        with: { go-version: "1.24", cache: false }

      - name: Tor with fake SNI (OpenSSL + libevent + tor, patched, from source)
        run: |
          set -e
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          NDK="$NDK" OUT="$PWD/out" WORK="$RUNNER_TEMP/tor-build" ./_cores/scripts/build-tor-android.sh
          for abi in $ABIS; do
            so="out/$abi/libtor.so"
            grep -aq -- '--fake-hosts' "$so" || { echo "::error::$abi tor was built without the fake SNI patch"; exit 1; }
            readelf -lW "$so" | awk '$1=="LOAD"{print $NF}' | grep -qv 0x4000 && { echo "::error::$abi tor is not 16 KB aligned"; exit 1; } || true
          done

      - name: lyrebird, Conjure and Snowflake for every ABI
        run: |
          set -e
          wf() { sed -n "s/^  $2: *\"\(.*\)\" *\$/\1/p" "_cores/.github/workflows/$1.yml" | head -1; }
          SNOWFLAKE=$(wf tor SNOWFLAKE);  SNOWFLAKE=${SNOWFLAKE:-v2.14.1}
          CONJURE=$(wf tor CONJURE);      CONJURE=${CONJURE:-v0.0.0-20260113185639-0090962226b8}
          LYREBIRD=$(wf tor LYREBIRD);    LYREBIRD=${LYREBIRD:-v0.0.0-20260115133752-0b10edbb61e0}
          echo "snowflake=$SNOWFLAKE conjure=$CONJURE lyrebird=$LYREBIRD"
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          src() { go mod download -json "$1@$2" | python3 -c 'import sys, json; print(json.load(sys.stdin)["Dir"])'; }
          LYREBIRD_DIR=$(src gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/lyrebird "$LYREBIRD")
          CONJURE_DIR=$(src gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/conjure "$CONJURE")
          SNOWFLAKE_DIR=$(src gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/snowflake/v2 "$SNOWFLAKE")
          [ -d "$LYREBIRD_DIR/cmd/lyrebird" ] && [ -d "$CONJURE_DIR/client" ] && [ -d "$SNOWFLAKE_DIR/client" ] || { echo "::error::a transport did not come through the Go module proxy"; exit 1; }
          for triple in "arm64:arm64-v8a:aarch64-linux-android24-clang" \
                        "arm:armeabi-v7a:armv7a-linux-androideabi24-clang" \
                        "amd64:x86_64:x86_64-linux-android24-clang"; do
            arch=${triple%%:*}; rest=${triple#*:}; abi=${rest%%:*}; cc=${rest#*:}
            export CGO_ENABLED=1 CC="$BIN/$cc" GOOS=android GOARCH=$arch GOARM=7
            ( cd "$LYREBIRD_DIR"   && go build -trimpath -ldflags="-s -w -checklinkname=0 -extldflags=-Wl,-z,max-page-size=16384" -o "$GITHUB_WORKSPACE/out/$abi/libobfs4proxy.so" ./cmd/lyrebird )
            ( cd "$CONJURE_DIR"    && go build -trimpath -ldflags="-s -w -checklinkname=0 -extldflags=-Wl,-z,max-page-size=16384" -o "$GITHUB_WORKSPACE/out/$abi/libconjure.so" ./client )
            ( cd "$SNOWFLAKE_DIR"  && go build -trimpath -ldflags="-s -w -checklinkname=0 -extldflags=-Wl,-z,max-page-size=16384" -o "$GITHUB_WORKSPACE/out/$abi/libsnowflake.so" ./client )
          done

      - name: Pack jniLibs
        run: |
          set -e
          for abi in $ABIS; do
            mkdir -p "stage/jniLibs/$abi"
            for lib in libtor libobfs4proxy libconjure libsnowflake; do
              [ -s "out/$abi/$lib.so" ] || { echo "::error::$abi/$lib.so is missing"; exit 1; }
              readelf -lW "out/$abi/$lib.so" | awk '$1=="LOAD"{print $NF}' | grep -qv 0x4000 && { echo "::error::$abi/$lib.so is not 16 KB aligned"; exit 1; } || true
              cp "out/$abi/$lib.so" "stage/jniLibs/$abi/"
            done
          done
          chmod +x stage/jniLibs/*/*.so
          ( cd stage && zip -q -r -X "$GITHUB_WORKSPACE/tor-android.zip" jniLibs )
          unzip -l tor-android.zip

      - uses: actions/upload-artifact@v7
        with:
          name: core-tor
          path: tor-android.zip
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------
  # 3. libsnispoof
  # -------------------------------------------------------------------------
  snispoof:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Get the ZedSecure-Cores workflow at the expected version (for the SNI-spoof tag)
        env:
          TAG: ${{ needs.plan.outputs.snispoof }}
        run: |
          git clone -q --filter=blob:none "https://github.com/${CORES_REPO}.git" _cores
          git -C _cores checkout -q "$TAG" || echo "::warning::tag $TAG not found in $CORES_REPO, using its default branch"

      - uses: actions/setup-go@v7
        with: { go-version: "1.26.3", cache: false }

      - name: SNI-Spoofing-Go for every ABI
        run: |
          set -e
          wf() { sed -n "s/^  $2: *\"\(.*\)\" *\$/\1/p" "_cores/.github/workflows/$1.yml" | head -1; }
          SNISPOOF=$(wf snispoof SNISPOOF); SNISPOOF=${SNISPOOF:-v0.7.2}
          echo "SNI-Spoofing-Go $SNISPOOF"
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          git clone -q --depth 1 -b "$SNISPOOF" https://github.com/aleskxyz/SNI-Spoofing-Go.git src
          for triple in "arm64:arm64-v8a:aarch64-linux-android24-clang" \
                        "arm:armeabi-v7a:armv7a-linux-androideabi24-clang" \
                        "amd64:x86_64:x86_64-linux-android24-clang"; do
            arch=${triple%%:*}; rest=${triple#*:}; abi=${rest%%:*}; cc=${rest#*:}
            mkdir -p "stage/jniLibs/$abi"
            ( cd src && CGO_ENABLED=1 CC="$BIN/$cc" GOOS=android GOARCH=$arch GOARM=7 \
                go build -trimpath -ldflags="-s -w -extldflags=-Wl,-z,max-page-size=16384" -o "$GITHUB_WORKSPACE/stage/jniLibs/$abi/libsnispoof.so" . )
          done
          chmod +x stage/jniLibs/*/*.so
          ( cd stage && zip -q -r -X "$GITHUB_WORKSPACE/snispoof-android.zip" jniLibs )
          unzip -l snispoof-android.zip

      - uses: actions/upload-artifact@v7
        with:
          name: core-snispoof
          path: snispoof-android.zip
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------
  # 4. libhev-socks5-tunnel
  # -------------------------------------------------------------------------
  hev:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Get the ZedSecure-Cores workflow at the expected version (for the hev tag)
        env:
          TAG: ${{ needs.plan.outputs.hev }}
        run: |
          git clone -q --filter=blob:none "https://github.com/${CORES_REPO}.git" _cores
          git -C _cores checkout -q "$TAG" || echo "::warning::tag $TAG not found in $CORES_REPO, using its default branch"

      - name: hev-socks5-tunnel as the JNI library the app loads
        run: |
          set -e
          wf() { sed -n "s/^  $2: *\"\(.*\)\" *\$/\1/p" "_cores/.github/workflows/$1.yml" | head -1; }
          HEV=$(wf hev HEV); HEV=${HEV:-2.18.0}
          echo "hev-socks5-tunnel $HEV"
          git clone -q --depth 1 --branch "$HEV" --recursive https://github.com/heiher/hev-socks5-tunnel hev/jni
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          "$NDK/ndk-build" -C hev -j"$(nproc)" APP_ABI="$ABIS" APP_MODULES=hev-socks5-tunnel APP_PLATFORM=android-24
          for abi in $ABIS; do
            so="hev/libs/$abi/libhev-socks5-tunnel.so"
            readelf -h "$so" | grep -q 'DYN (Shared object file)' || { echo "::error::$abi: hev is not a shared library"; exit 1; }
            readelf --dyn-syms -W "$so" | grep -qw JNI_OnLoad || { echo "::error::$abi: hev has no JNI_OnLoad"; exit 1; }
            grep -aq 'hev/htproxy/TProxyService' "$so" || { echo "::error::$abi: hev does not bind hev.htproxy.TProxyService"; exit 1; }
            if readelf -d "$so" | grep -qE '\(RELR\)|0x0*6fffe000 '; then echo "::error::$abi: hev uses RELR relocations, which Android 7 and 8 cannot load"; exit 1; fi
            mkdir -p "stage/jniLibs/$abi"
            cp "$so" "stage/jniLibs/$abi/"
          done
          chmod +x stage/jniLibs/*/*.so
          ( cd stage && zip -q -r -X "$GITHUB_WORKSPACE/hev-android.zip" jniLibs )
          unzip -l hev-android.zip

      - uses: actions/upload-artifact@v7
        with:
          name: core-hev
          path: hev-android.zip
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------
  # 5. libzeptun + libzeptun-jni  (Noisemux/zeptun, Zig + ndk-build)
  # -------------------------------------------------------------------------
  zeptun:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout zeptun at the version the app expects
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.plan.outputs.zeptun_repo }}
          ref: ${{ needs.plan.outputs.zeptun_tag }}

      - name: Zig version the project releases with
        id: zig
        run: |
          v=$(sed -n 's/^  ZIG_VERSION: *\([0-9.]*\).*/\1/p' .github/workflows/release.yml | head -1)
          echo "version=${v:-0.17.1}" >> "$GITHUB_OUTPUT"
          echo "zig ${v:-0.17.1}"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: Build libzeptun.so and libzeptun-jni.so
        run: ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT} sh scripts/build_android.sh

      - name: Check 16 KB alignment and pack jniLibs
        run: |
          set -e
          for abi in $ABIS; do
            for lib in libzeptun libzeptun-jni; do
              so="zig-out/android/jniLibs/$abi/$lib.so"
              [ -s "$so" ] || { echo "::error::$abi/$lib.so was not built"; exit 1; }
            done
            so="zig-out/android/jniLibs/$abi/libzeptun.so"
            align=$(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF; exit }')
            echo "$so $align"
            [ "$align" = "0x4000" ] || { echo "::error::$so is not 16 KB aligned"; exit 1; }
            mkdir -p "stage/jniLibs/$abi"
            cp "zig-out/android/jniLibs/$abi/libzeptun.so" "zig-out/android/jniLibs/$abi/libzeptun-jni.so" "stage/jniLibs/$abi/"
          done
          chmod +x stage/jniLibs/*/*.so
          ( cd stage && zip -q -r -X "$GITHUB_WORKSPACE/zeptun-android.zip" jniLibs )
          unzip -l zeptun-android.zip

      - uses: actions/upload-artifact@v7
        with:
          name: core-zeptun
          path: zeptun-android.zip
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------
  # 5b. libopenconnect.so: Download and extract from the official release APK
  # -------------------------------------------------------------------------
  openconnect:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Extract libopenconnect.so from official release v3.1.8
        run: |
          set -e
          mkdir -p stage/jniLibs work
          BASE_URL="https://github.com/CluvexStudio/ZedSecure/releases/download/v3.1.8"

          echo "Downloading official APKs..."
          curl -fsSL --retry 3 -o work/universal.apk "$BASE_URL/ZedSecure-3.1.8-universal.apk"
          curl -fsSL --retry 3 -o work/x86_64.apk "$BASE_URL/ZedSecure-3.1.8-x86_64.apk" || true

          # Extract ARM libs from universal APK
          unzip -q work/universal.apk "lib/arm64-v8a/libopenconnect.so" "lib/armeabi-v7a/libopenconnect.so" -d work/arm_out || true

          # Extract x86_64 lib if available
          if [ -f work/x86_64.apk ]; then
            unzip -q work/x86_64.apk "lib/x86_64/libopenconnect.so" -d work/x86_out || true
          fi

          for abi in $ABIS; do
            mkdir -p "stage/jniLibs/$abi"
            src=""
            if [ -f "work/arm_out/lib/$abi/libopenconnect.so" ]; then
              src="work/arm_out/lib/$abi/libopenconnect.so"
            elif [ -f "work/x86_out/lib/$abi/libopenconnect.so" ]; then
              src="work/x86_out/lib/$abi/libopenconnect.so"
            fi

            if [ -n "$src" ] && [ -f "$src" ]; then
              cp "$src" "stage/jniLibs/$abi/libopenconnect.so"
              echo "Extracted $abi: $src"
            else
              echo "::error::Could not extract libopenconnect.so for $abi"
              exit 1
            fi

            out="stage/jniLibs/$abi/libopenconnect.so"
            chmod +x "$out"
            # Verify JNI entry points
            readelf --dyn-syms -W "$out" | grep -q ' Java_org_infradead_libopenconnect_' || { echo "::error::$abi has no JNI entry"; exit 1; }
            ls -l "$out"
          done

          ( cd stage && zip -q -r -X "$GITHUB_WORKSPACE/openconnect-android.zip" jniLibs )
          unzip -l openconnect-android.zip

      - uses: actions/upload-artifact@v7
        with:
          name: core-openconnect
          path: openconnect-android.zip
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------------
  # 6. The app itself: assemble, sign, and publish APKs to current repo release
  # -------------------------------------------------------------------------
  apk:
    needs: [plan, zedcore, tor, snispoof, hev, zeptun, openconnect]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # 1. Checkout upstream code
      - name: Checkout source code from upstream repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      # 2. Java & Gradle setup
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      # 3. Put every engine into place
      - uses: actions/download-artifact@v8
        with:
          pattern: core-*
          path: cores-in
          merge-multiple: true

      - name: Install the engines we built
        run: |
          set -e
          ls -l cores-in
          for f in zedcore.aar tor-android.zip snispoof-android.zip hev-android.zip zeptun-android.zip openconnect-android.zip; do
            [ -s "cores-in/$f" ] || { echo "::error::cores-in/$f is missing"; exit 1; }
          done
          mkdir -p app/libs app/src/main/jniLibs
          cp cores-in/zedcore.aar app/libs/zedcore.aar
          for z in tor snispoof hev zeptun openconnect; do
            unzip -q -o "cores-in/$z-android.zip" -d app/src/main
          done
          echo "libopenconnect.so: extracted from official release v3.1.8" | tee -a "$GITHUB_STEP_SUMMARY"
          find app/src/main/jniLibs -name '*.so' -exec chmod +x {} +

      # 4. Engine verification
      - name: Check the engines
        run: |
          set -e
          ls -l app/libs/zedcore.aar
          for abi in $ABIS; do
            for lib in libtor libobfs4proxy libsnowflake libconjure libsnispoof libhev-socks5-tunnel libzeptun libzeptun-jni libopenconnect; do
              [ -f "app/src/main/jniLibs/$abi/$lib.so" ] || { echo "::error::$abi/$lib.so is missing"; exit 1; }
            done
            for lib in libhev-socks5-tunnel libopenconnect libzeptun-jni; do
              so="app/src/main/jniLibs/$abi/$lib.so"
              [ -f "$so" ] || continue
              readelf --dyn-syms -W "$so" | grep -qE ' (JNI_OnLoad|Java_)' || { echo "::error::$abi/$lib.so has no JNI entry points; the app would crash loading it"; exit 1; }
            done
            for so in app/src/main/jniLibs/$abi/*.so; do
              case "$so" in */libzeptun*) continue ;; esac
              if readelf -d "$so" | grep -qE '\(RELR\)|0x0*6fffe000 '; then echo "::error::$so uses RELR relocations, which Android 7 and 8 cannot load"; exit 1; fi
            done
          done
          find app/src/main/jniLibs -name '*.so' | sort

      # 5. Keystore configuration
      - name: Unlock signing
        env:
          USE_PLAY: ${{ inputs.signing_key != 'upload' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          umask 077
          if [ "$USE_PLAY" = "true" ]; then
            printf '%s' "$PLAY_KEYSTORE_BASE64" | base64 -d > release.keystore
            STORE_PW="$PLAY_KEYSTORE_PASSWORD"; KEY_PW="$PLAY_KEY_PASSWORD"; ALIAS="$PLAY_KEY_ALIAS"
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
            STORE_PW="$KEYSTORE_PASSWORD"; KEY_PW="$KEY_PASSWORD"; ALIAS="$KEY_ALIAS"
          fi
          { echo "storeFile=release.keystore"; echo "storePassword=$STORE_PW"
            echo "keyPassword=$KEY_PW"; echo "keyAlias=$ALIAS"; } > keystore.properties

      # 6. Assemble APKs
      - name: Build
        run: ./gradlew --warning-mode all :app:assembleRelease

      # 7. Align, pack universal, and sign APKs
      - name: Name and sign APKs
        env:
          V: ${{ needs.plan.outputs.version }}
        run: |
          set -e
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app/build/outputs/apk/release/app-$abi-release.apk"
            [ -f "$src" ] || { echo "::error::$src was not built"; exit 1; }
            cp "$src" "dist/ZedSecure-$V-$abi.apk"
          done
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python3 tools/universal-apk.py "dist/ZedSecure-$V-arm64-v8a.apk" /tmp/universal.apk "dist/ZedSecure-$V-armeabi-v7a.apk"
          "$BT/zipalign" -f -P 16 4 /tmp/universal.apk /tmp/universal-aligned.apk
          STORE_PW=$(grep '^storePassword=' keystore.properties | cut -d= -f2-) \
          KEY_PW=$(grep '^keyPassword=' keystore.properties | cut -d= -f2-) \
          "$BT/apksigner" sign --ks release.keystore \
            --ks-key-alias "$(grep '^keyAlias=' keystore.properties | cut -d= -f2-)" \
            --ks-pass env:STORE_PW --key-pass env:KEY_PW \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false \
            --out "dist/ZedSecure-$V-universal.apk" /tmp/universal-aligned.apk
          rm -f /tmp/universal.apk /tmp/universal-aligned.apk
          for apk in dist/ZedSecure-*.apk; do
            "$BT/apksigner" verify "$apk"
            a=$("$BT/apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256' | awk '{print $NF}')
            b=$("$BT/apksigner" verify --print-certs "dist/ZedSecure-$V-arm64-v8a.apk" | grep -m1 'SHA-256' | awk '{print $NF}')
            [ "$a" = "$b" ] || { echo "::error::$apk is signed with a different key"; exit 1; }
          done
          "$BT/aapt2" dump badging "dist/ZedSecure-$V-universal.apk" | grep -q "native-code: 'arm64-v8a' 'armeabi-v7a'" \
            || { echo "::error::the universal APK does not carry both ARM ABIs"; exit 1; }
          ( cd dist && sha256sum ZedSecure-*.apk > SHA256SUMS-android.txt )
          ls -l dist

      # 8. Clean up keys
      - name: Forget the key
        if: always()
        run: shred -u release.keystore keystore.properties 2>/dev/null || rm -f release.keystore keystore.properties

      # 9. Force Create/Update Release in Current Repository & Upload Standalone APKs
      - name: Force Release to Current Repository
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
          ENGINES: "zedcore ${{ needs.plan.outputs.zedcore }}, tor ${{ needs.plan.outputs.tor }}, snispoof ${{ needs.plan.outputs.snispoof }}, hev ${{ needs.plan.outputs.hev }}, zeptun ${{ needs.plan.outputs.zeptun_tag }}"
        run: |
          set -e
          V="${VERSION:-${{ github.run_number }}}"
          TAG_NAME="v$V"
          RELEASE_TITLE="ZedSecure $V"
          NOTES="Automated build of ${UPSTREAM_REPO}@${SHA:0:7}. Engines: ${ENGINES}."

          echo "Targeting release: $TAG_NAME"

          # 1. If the release does not exist in this repository, create it (forcefully attached to the current commit)
          if ! gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG_NAME not found. Creating new release..."
            gh release create "$TAG_NAME" \
              --target "${{ github.sha }}" \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES" \
              --repo "${{ github.repository }}"
          else
            echo "Release $TAG_NAME already exists."
          fi

          # 2. Upload APKs and Checksums directly (clobbering any existing files)
          echo "Uploading individual APK files..."
          gh release upload "$TAG_NAME" dist/ZedSecure-*.apk dist/SHA256SUMS-android.txt \
            --clobber \
            --repo "${{ github.repository }}"

          echo "Successfully published standalone APK files to release $TAG_NAME in ${{ github.repository }}."

      # 10. Backup artifacts on GitHub Actions tab
      - uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: dist/*
          retention-days: 30
